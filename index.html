<script>
    (function () {
        const CENTRAL_STATES = ['NE', 'IA', 'KS', 'MO', 'TX', 'AR'];
        const PHONES = {
            central: { display: '(913) 218-1100', raw: '+19132181100' },
            default: { display: '(828) 490-1210', raw: '+18284901210' }
        };
        const CACHE_KEY = 'geo_state_cache';
        const CACHE_TTL = 24 * 60 * 60 * 1000;

        function applyPhone(stateCode) {
            const phone = CENTRAL_STATES.includes(stateCode) ? PHONES.central : PHONES.default;
            const link = document.getElementById('geo-phone-link');
            const row  = document.getElementById('geo-phone-row');
            link.href        = 'tel:' + phone.raw;
            link.textContent = phone.display;
            row.classList.add('resolved');
        }

        function fetchWithTimeout(url, ms) {
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), ms);
            return fetch(url, { signal: controller.signal })
                .finally(() => clearTimeout(timeout));
        }

        function resolve() {
            try {
                const cached = JSON.parse(localStorage.getItem(CACHE_KEY));
                if (cached && (Date.now() - cached.ts) < CACHE_TTL) {
                    applyPhone(cached.state);
                    return;
                }
            } catch (e) {}

            // Primary: ipwho.is (more reliable free tier)
            fetchWithTimeout('https://ipwho.is/', 3000)
                .then(r => r.json())
                .then(data => {
                    if (!data || !data.region_code) throw new Error('no region_code');
                    return data.region_code.trim().toUpperCase();
                })
                .catch(() =>
                    // Fallback: ipapi.co
                    fetchWithTimeout('https://ipapi.co/region_code/', 3000)
                        .then(r => r.text())
                        .then(t => {
                            const s = t.trim().toUpperCase();
                            if (!s || s.length > 3) throw new Error('bad response');
                            return s;
                        })
                )
                .then(state => {
                    try {
                        localStorage.setItem(CACHE_KEY, JSON.stringify({ state, ts: Date.now() }));
                    } catch (e) {}
                    applyPhone(state);
                })
                .catch(() => applyPhone('')); // both failed — show default
        }

        resolve();
    })();
</script>
